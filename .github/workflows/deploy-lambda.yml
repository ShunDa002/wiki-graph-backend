name: Deploy FastAPI to AWS Lambda

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

# OIDC id-token permission is no longer required.
permissions:
  contents: read

concurrency:
  group: production-lambda
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  STACK_NAME: ${{ vars.LAMBDA_STACK_NAME }}
  FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
  FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-24.04-arm
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pytest -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Ensure ECR repository exists
        shell: bash
        run: |
          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            >/dev/null 2>&1
          then
            echo "ECR repository already exists: $ECR_REPOSITORY"
          else
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability IMMUTABLE \
              >/dev/null

            echo "Created ECR repository: $ECR_REPOSITORY"
          fi

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push commit-SHA ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: >-
            ${{ steps.ecr.outputs.registry }}/${{
            env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy CloudFormation stack
        env:
          IMAGE_URI: >-
            ${{ steps.ecr.outputs.registry }}/${{
            env.ECR_REPOSITORY }}:${{ github.sha }}

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GRAPH_REBUILD_API_KEY: ${{ secrets.GRAPH_REBUILD_API_KEY }}
          WIKI_RELOAD_API_KEY: ${{ secrets.WIKI_RELOAD_API_KEY }}

          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        shell: bash
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infrastructure/lambda.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              FunctionName="$FUNCTION_NAME" \
              ImageUri="$IMAGE_URI" \
              OpenRouterApiKey="$OPENROUTER_API_KEY" \
              OpenRouterModel="${OPENROUTER_MODEL:-openrouter/free}" \
              FrontendOrigin="$FRONTEND_ORIGIN" \
              GraphRebuildApiKey="$GRAPH_REBUILD_API_KEY" \
              WikiReloadApiKey="$WIKI_RELOAD_API_KEY" \
              LogRetentionDays=14

      - name: Print Lambda Function URL
        shell: bash
        run: |
          FUNCTION_URL="$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query \
                "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue | [0]" \
              --output text
          )"

          echo "Lambda Function URL: $FUNCTION_URL"
          echo "### Lambda deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Function URL: $FUNCTION_URL" >> "$GITHUB_STEP_SUMMARY"
