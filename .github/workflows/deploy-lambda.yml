name: Deploy FastAPI to AWS Lambda

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

# 当前使用 IAM User access key，不需要 id-token: write。
permissions:
  contents: read

concurrency:
  group: production-lambda
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  STACK_NAME: ${{ vars.LAMBDA_STACK_NAME }}
  FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
  FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
  OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-24.04-arm
    environment: production

    # 这些变量会提供给 job 中的所有步骤。
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GRAPH_REBUILD_SECRET_KEY: ${{ secrets.GRAPH_REBUILD_SECRET_KEY }}
      WIKI_RELOAD_SECRET_KEY: ${{ secrets.WIKI_RELOAD_SECRET_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Validate base deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${AWS_REGION:?AWS_REGION is required}"
          : "${ECR_REPOSITORY:?ECR_REPOSITORY is required}"
          : "${STACK_NAME:?STACK_NAME is required}"
          : "${FUNCTION_NAME:?FUNCTION_NAME is required}"
          : "${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}"
          : "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}"
          : "${GRAPH_REBUILD_SECRET_KEY:?GRAPH_REBUILD_SECRET_KEY is required}"
          : "${WIKI_RELOAD_SECRET_KEY:?WIKI_RELOAD_SECRET_KEY is required}"

          case "$AWS_REGION" in
            *[!a-z0-9-]*|"")
              echo "AWS_REGION contains invalid characters."
              exit 1
              ;;
          esac

          case "$ECR_REPOSITORY" in
            *://*|*.amazonaws.com/*)
              echo "ECR_REPOSITORY must contain only the repository name."
              echo "Example: wiki-graph-backend"
              exit 1
              ;;
          esac

          case "$FRONTEND_ORIGIN" in
            http://*|https://*)
              ;;
            *)
              echo "FRONTEND_ORIGIN must start with http:// or https://"
              exit 1
              ;;
          esac

          # Lambda Function URL CORS expects an origin, not a URL path.
          FRONTEND_WITHOUT_SCHEME="${FRONTEND_ORIGIN#http://}"
          FRONTEND_WITHOUT_SCHEME="${FRONTEND_WITHOUT_SCHEME#https://}"

          if [[ "$FRONTEND_WITHOUT_SCHEME" == */* ]]; then
            echo "FRONTEND_ORIGIN must not contain a URL path."
            echo "Use: https://example.com"
            echo "Not: https://example.com/path"
            exit 1
          fi

          echo "AWS region: $AWS_REGION"
          echo "ECR repository: $ECR_REPOSITORY"
          echo "CloudFormation stack: $STACK_NAME"
          echo "Lambda function: $FUNCTION_NAME"
          echo "Frontend origin: $FRONTEND_ORIGIN"

      - name: Ensure ECR repository exists
        shell: bash
        run: |
          set -euo pipefail

          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            >/dev/null 2>&1
          then
            echo "ECR repository already exists: $ECR_REPOSITORY"
          else
            echo "ECR repository not found. Creating: $ECR_REPOSITORY"

            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability IMMUTABLE \
              >/dev/null

            echo "Created ECR repository: $ECR_REPOSITORY"
          fi

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set deployment image URI
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          : "${ECR_REGISTRY:?ECR registry output is required}"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "Deployment image: $IMAGE_URI"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push commit-SHA ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_URI }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image exists in ECR
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].{Digest:imageDigest,PushedAt:imagePushedAt,Size:imageSizeInBytes}' \
            --output table

      - name: Validate final deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${IMAGE_URI:?IMAGE_URI is required}"
          : "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}"
          : "${GRAPH_REBUILD_SECRET_KEY:?GRAPH_REBUILD_SECRET_KEY is required}"
          : "${WIKI_RELOAD_SECRET_KEY:?WIKI_RELOAD_SECRET_KEY is required}"

          case "$IMAGE_URI" in
            "${ECR_REPOSITORY}:${GITHUB_SHA}")
              echo "IMAGE_URI is missing its ECR registry."
              exit 1
              ;;
            *".dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}")
              ;;
            *)
              echo "IMAGE_URI has an unexpected format."
              echo "Image URI: $IMAGE_URI"
              exit 1
              ;;
          esac

          echo "Deployment configuration is valid."
          echo "Image URI: $IMAGE_URI"

      - name: Validate CloudFormation template syntax
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation validate-template \
            --template-body file://infrastructure/lambda.yaml \
            --query '{Description:Description,Parameters:Parameters[].ParameterKey}' \
            --output table

      - name: Deploy CloudFormation stack
        id: deploy
        shell: bash
        run: |
          set -uo pipefail

          if aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --template-file infrastructure/lambda.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              FunctionName="$FUNCTION_NAME" \
              ImageUri="$IMAGE_URI" \
              OpenRouterApiKey="$OPENROUTER_API_KEY" \
              OpenRouterModel="${OPENROUTER_MODEL:-openrouter/free}" \
              FrontendOrigin="$FRONTEND_ORIGIN" \
              GraphRebuildApiKey="$GRAPH_REBUILD_SECRET_KEY" \
              WikiReloadApiKey="$WIKI_RELOAD_SECRET_KEY" \
              LogRetentionDays=14
          then
            echo "CloudFormation deployment completed successfully."
          else
            DEPLOY_EXIT_CODE=$?

            echo "::error::CloudFormation deployment failed."
            echo "Retrieving failed CloudFormation events..."

            # Newer AWS CLI and CloudFormation API.
            aws cloudformation describe-events \
              --region "$AWS_REGION" \
              --stack-name "$STACK_NAME" \
              --filters FailedEvents=true \
              --query \
                'OperationEvents[].{
                  Time:Timestamp,
                  Resource:LogicalResourceId,
                  Type:ResourceType,
                  Status:ResourceStatus,
                  Message:StatusReason
                }' \
              --output table \
              || true

            echo "Retrieving traditional stack events..."

            # Fallback for existing stacks and runtime provisioning errors.
            aws cloudformation describe-stack-events \
              --region "$AWS_REGION" \
              --stack-name "$STACK_NAME" \
              --query \
                'StackEvents[?contains(ResourceStatus, `FAILED`)] | [0:20].{
                  Time:Timestamp,
                  Resource:LogicalResourceId,
                  Type:ResourceType,
                  Status:ResourceStatus,
                  Message:ResourceStatusReason
                }' \
              --output table \
              || true

            exit "$DEPLOY_EXIT_CODE"
          fi

      - name: Read CloudFormation outputs
        id: stack-outputs
        shell: bash
        run: |
          set -euo pipefail

          FUNCTION_URL="$(
            aws cloudformation describe-stacks \
              --region "$AWS_REGION" \
              --stack-name "$STACK_NAME" \
              --query \
                "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue | [0]" \
              --output text
          )"

          DEPLOYED_FUNCTION_NAME="$(
            aws cloudformation describe-stacks \
              --region "$AWS_REGION" \
              --stack-name "$STACK_NAME" \
              --query \
                "Stacks[0].Outputs[?OutputKey=='FunctionName'].OutputValue | [0]" \
              --output text
          )"

          if [[ -z "$FUNCTION_URL" || "$FUNCTION_URL" == "None" ]]; then
            echo "::error::FunctionUrl was not found in CloudFormation outputs."
            exit 1
          fi

          if [[ -z "$DEPLOYED_FUNCTION_NAME" ||
                "$DEPLOYED_FUNCTION_NAME" == "None" ]]
          then
            echo "::error::FunctionName was not found in CloudFormation outputs."
            exit 1
          fi

          echo "function_url=$FUNCTION_URL" >> "$GITHUB_OUTPUT"
          echo "function_name=$DEPLOYED_FUNCTION_NAME" >> "$GITHUB_OUTPUT"

      - name: Test Lambda Function URL
        shell: bash
        env:
          FUNCTION_URL: ${{ steps.stack-outputs.outputs.function_url }}
        run: |
          set -euo pipefail

          HEALTH_URL="${FUNCTION_URL%/}/health"

          echo "Testing Lambda Function URL: $HEALTH_URL"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output /tmp/lambda-response.txt \
              --write-out '%{http_code}' \
              --connect-timeout 15 \
              --max-time 120 \
              "$HEALTH_URL"
          )"

          echo "HTTP status: $HTTP_STATUS"

          echo "Response body:"
          head -c 2000 /tmp/lambda-response.txt || true
          echo

          if [[ "$HTTP_STATUS" -ge 500 ]]; then
            echo "::error::Lambda Function URL returned HTTP $HTTP_STATUS"

            # 给 CloudWatch 几秒钟完成日志写入。
            sleep 8

            echo "Recent Lambda logs:"
            aws logs tail "/aws/lambda/$FUNCTION_NAME" \
              --region "$AWS_REGION" \
              --since 15m \
              --format detailed \
              || true

            exit 1
          fi

      - name: Write deployment summary
        if: success()
        shell: bash
        env:
          FUNCTION_URL: ${{ steps.stack-outputs.outputs.function_url }}
          DEPLOYED_FUNCTION_NAME: ${{ steps.stack-outputs.outputs.function_name }}
        run: |
          set -euo pipefail

          {
            echo "### Lambda deployment"
            echo
            echo "- Region: \`$AWS_REGION\`"
            echo "- Stack: \`$STACK_NAME\`"
            echo "- Function: \`$DEPLOYED_FUNCTION_NAME\`"
            echo "- Repository: \`$ECR_REPOSITORY\`"
            echo "- Architecture: \`arm64\`"
            echo "- Image tag: \`$GITHUB_SHA\`"
            echo "- Image URI: \`$IMAGE_URI\`"
            echo "- Function URL: $FUNCTION_URL"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Lambda Function URL: $FUNCTION_URL"
